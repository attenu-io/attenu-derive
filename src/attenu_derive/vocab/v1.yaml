# Closed caveat vocabulary v1 (draft, P0). Versioned; the L3 output JSON schema is GENERATED from this.
version: 1.2   # 2026-08-18: scoped call ceilings (T4); device.actuate family (T7)
scopes:
  # resource families (draft ~60 target; seed) — verbs: read | write | export | send | exec | delegate
  - crm.read
  - crm.write
  - crm.export
  - mail.read
  - mail.send
  - fs.read
  - fs.write
  - fs.delete
  - web.fetch
  - web.search
  - code.exec
  - db.read
  - db.write
  - payments.transfer
  - agent.delegate.*
  - data.read          # generic API/data families (heuristic tier + datasets)
  - data.write
  - data.delete
  - compute.pure       # pure computation, no resource
  - agent.message
  - state.write        # internal scratch state (todos), not a resource
  - device.actuate     # physical / local device actuation incl. media playback (vehicle, appliance, smart-home) — tier 1 (T7, from BFCL traffic)
ceilings:            # existing attenu-guard types only
  - RowLimit
  - SpendCap
  - CallLimit          # may be SCOPED: CallLimit(max, applies_to=<scope|pattern>) — key max_calls[<scope>], auto-metered per node+pattern by the Guard (shim >= 0.3)
  - EgressRank       # none | internal | any
  - Allow            # fields: region, recipient_domain, repo
  - Deny
  - Prefix           # fields: path
ttl_buckets_seconds: [300, 900, 3600, 14400]
unknown_tool_scope: "unknown.<tool>"   # granted by no template — fail-closed
