name: ci
permissions: read-all
on: { push: {}, pull_request: {}, workflow_dispatch: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # attenu-guard comes from PyPI (0.5.0+); the pre-release SSH deploy-key path is gone.
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q pytest hypothesis
          # sampling-harness frameworks, so the budget-guard proofs (T1 deepagents, T9 ADK) RUN in CI instead of skipping
          pip install -q "google-adk>=2.7" "deepagents>=0.7" "langchain-anthropic>=1.0" "crewai>=1.15" litellm
          pip install -q -e .
          python -c "import attenu_guard, attenu_derive; print('attenu-guard', attenu_guard.__version__)"
      - run: python -m pytest -q
      - name: G1 eval card (committed gold, express held out) — fails on regression vs eval/thresholds.json
        run: python -m attenu_derive.eval.g1 --holdout express --check --out reports
