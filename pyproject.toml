[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "attenu-derive"
version = "0.2.1"
description = "Attenu Derive: computes the permission set each AI agent task needs from the app itself — roster, tools, observed calls — for attenu-guard to enforce on every tool call and sub-agent handoff."
keywords = ["ai", "agents", "security", "authorization", "least-privilege", "permissions", "delegation", "sub-agents", "audit-log", "owasp", "langgraph", "crewai", "google-adk", "openai-agents", "claude-agent-sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Attenu" }]
dependencies = ["attenu-guard>=0.4", "pyyaml>=6", "cryptography>=41"]     # the enforcement shim; the engine proposes, the shim's meet disposes

[project.urls]
Homepage = "https://attenu.io"
Documentation = "https://attenu.io/docs/"
Source = "https://github.com/attenu-io/attenu-derive"
Issues = "https://github.com/attenu-io/attenu-derive/issues"
Changelog = "https://attenu.io/changelog/"

[project.scripts]
attenu = "attenu_derive.cli:main"

[project.optional-dependencies]
kms = ["boto3>=1.34"]
retrieval = []          # ADR-08: heavy retrieval deps stay behind an extra (chosen in P2)
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]     # OpenAI-compatible incl. Azure/Bedrock gateways
dev = ["pytest>=8", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/attenu_derive"]
